services:
  mysql:
    image: mysql:8.4
    container_name: hcmcyu-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - hcmcyu_mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d

volumes:
  hcmcyu_mysql_data:

