server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - ${FRONTEND_URL:http://localhost:5173}
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - '*'
            exposed-headers:
              - Location
            allow-credentials: true
            max-age: 3600
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - RewritePath=/api/auth/(?<segment>.*), /api/$\{segment}
        - id: member-service-members
          uri: ${MEMBER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/members/**
          filters:
            - RewritePath=/api/members/(?<segment>.*), /api/$\{segment}
        - id: member-service-organizations
          uri: ${MEMBER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/organizations/**
          filters:
            - RewritePath=/api/organizations/(?<segment>.*), /api/$\{segment}
        - id: event-service
          uri: ${EVENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/events/**
          filters:
            - RewritePath=/api/events/(?<segment>.*), /api/$\{segment}
        - id: content-service
          uri: ${CONTENT_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/posts/**
          filters:
            - RewritePath=/api/posts/(?<segment>.*), /api/$\{segment}
        - id: chat-service-http
          uri: ${CHAT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/chat/**
          filters:
            - RewritePath=/api/chat/(?<segment>.*), /api/$\{segment}
        - id: chat-service-websocket
          uri: ${CHAT_SERVICE_WS_URL:ws://localhost:8085}
          predicates:
            - Path=/ws/chat/**
          filters:
            - RewritePath=/ws/chat/(?<segment>.*), /ws/$\{segment}
        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/notifications/**
          filters:
            - RewritePath=/api/notifications/(?<segment>.*), /api/$\{segment}
        - id: audit-service
          uri: ${AUDIT_SERVICE_URL:http://localhost:8087}
          predicates:
            - Path=/api/audit-logs,/api/audit-logs/**

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:dev-only-hcmcyu-auth-service-secret-key-change-me-please-32}

management:
  endpoints:
    web:
      exposure:
        include: health,info
